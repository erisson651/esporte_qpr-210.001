<section id="form">
    <h2>Cadastro de Atleta</h2>

    <form id="atleta" (submit)="salvar()">

        <label for="nome">Nome Completo</label>
        <input 
            type="text" 
            name="nome" 
            id="nome" 
            class="input1" 
            maxlength="60"
            required 
            placeholder="Digite o nome Completo"
            [(ngModel)]="nome"
        >

        <label for="cpf">CPF*</label>
        <input 
            type="text" 
            name="cpf" 
            id="cpf" 
            class="input2" 
            maxlength="14"
            required 
            placeholder="Digite o CPF"
            [(ngModel)]="cpf"
        >

        <label for="sexo">Sexo</label>

        <input 
            type="radio" 
            name="sexo" 
            [(ngModel)]="sexo"
            id="masculino" 
            value="Masculino"
        >
        <label for="masculino">Masculino</label>

        <input 
            type="radio" 
            name="sexo" 
            [(ngModel)]="sexo"
            id="feminino" 
            value="Feminino"
        >
        <label for="feminino">Feminino</label>


        <label for="cep">CEP</label>
        <input 
            type="text" 
            name="cep" 
            id="cep" 
            class="input2" 
            maxlength="9"
            required 
            placeholder="Digite o CEP"
            [(ngModel)]="cep"
        >


        <label for="rua">Rua/Logradouro</label>
        <input 
            type="text" 
            name="rua" 
            id="rua" 
            class="input1" 
            maxlength="100"
            required 
            placeholder="Digite a Rua/Logradouro"
            [(ngModel)]="rua"
        >


        <label for="bairro">Bairro</label>
        <input 
            type="text" 
            name="bairro" 
            id="bairro" 
            class="input1" 
            maxlength="100"
            required 
            placeholder="Digite o Bairro"
            [(ngModel)]="bairro"
        >


        <label for="cidade">Cidade</label>
        <input 
            type="text" 
            name="cidade" 
            id="cidade" 
            class="input1" 
            maxlength="100"
            required 
            placeholder="Digite a Cidade"
            [(ngModel)]="cidade"
        >


        <label for="uf">Estado</label>
        <input 
            type="text" 
            name="uf" 
            id="uf" 
            class="input1" 
            maxlength="2"
            required 
            placeholder="Digite a UF"
            [(ngModel)]="uf"
        >


        <div id="div-btns">

            <button type="submit" id="btnAdd">
                {{!editar ? 'cadastrar' : 'alterar'}}
            </button>

            <button type="reset" id="btnLimpar">
                Limpar
            </button>

        </div>

    </form> 
</section>
