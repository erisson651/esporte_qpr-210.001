<section id="section-lista-atleta">
    <h2>Lista Atletas</h2>

    @for(elem of listaAtletas(); track elem.id) {
        <div class="atleta">

            <span class="span-dados-atleta">
                {{elem.id}} - {{ elem.nome }} - {{elem.cpf}} - {{elem.cidade}} - {{elem.uf}}
            </span>

            <span class="span-link-atletas">
                <a class="atleta-link-alterar" (click)="carregaDadosAtletaForm(atleta: elem)">A</a>
                <a class="atleta-link-excluir" (click)="excluir(elem.id)">E</a>
            </span>

        </div>
    } @empty {
        <div class="div-item-pessoa">
            NENHUM REGISTRO NA LISTA
        </div>
    }
</section>
