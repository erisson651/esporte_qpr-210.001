<section id="form">
    <h2>Cadastro de Corrida</h2>

    <form id="corrida" (submit)="salvar()">

        <label for="nome">Nome Completo</label>

        <input 
            type="text" 
            name="nome" 
            id="nome" 
            class="input1" 
            maxlength="60"
            required 
            placeholder="Digite o nome Completo"
            [(ngModel)]="nome"
        >

        <label for="cpf">CPF*</label>

        <input 
            type="text" 
            name="cpf" 
            id="cpf" 
            class="input2" 
            maxlength="14"
            required 
            placeholder="Digite o CPF"
            [(ngModel)]="cpf"
        >

        <label for="categoria">Categoria</label>

        <input 
            type="radio" 
            name="categoria" 
            [(ngModel)]="categoria"
            id="masculino" 
            value="Masculino"
        >

        <label for="masculino">Masculino</label>

        <input 
            type="radio" 
            name="categoria" 
            [(ngModel)]="categoria"
            id="feminino" 
            value="Feminino"
        >

        <label for="feminino">Feminino</label>


        <label for="distancia">Distância</label>

        <select 
            name="distancia" 
            id="distancia" 
            [(ngModel)]="distancia"
        >

            <option value="">Selecione a distância</option>
            <option value="5km">5 km</option>
            <option value="10km">10 km</option>
            <option value="15km">15 km</option>
            <option value="20km">20 km</option>
            <option value="30km">30 km</option>
            <option value="40km">40 km</option>
            <option value="50km">50 km</option>

        </select>


        <label for="cidade">Cidade</label>

        <input 
            type="text" 
            name="cidade" 
            id="cidade" 
            class="input1" 
            maxlength="100"
            required 
            placeholder="Digite a Cidade"
            [(ngModel)]="cidade"
        >


        <label for="uf">Estado</label>

        <input 
            type="text" 
            name="uf" 
            id="uf" 
            class="input1" 
            maxlength="2"
            required 
            placeholder="Digite a UF"
            [(ngModel)]="uf"
        >


        <div id="div-btns">

            <button type="submit" id="btnAdd">
                Cadastrar
            </button>

            <button type="reset" id="btnLimpar">
                Limpar
            </button>

        </div>

    </form>

</section>
