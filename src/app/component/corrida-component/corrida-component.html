<section id="form">

    <h2>Cadastro de Corrida</h2>

    <form id="corrida" (submit)="salvar()">

        <label for="nomeCorrida">Nome da Corrida</label>

        <input
            type="text"
            name="nomeCorrida"
            id="nomeCorrida"
            class="input1"
            maxlength="60"
            required
            placeholder="Digite o nome da corrida"
            [(ngModel)]="nomeCorrida"
        >

        <label for="dataCorrida">Data</label>

        <input
            type="date"
            name="dataCorrida"
            id="dataCorrida"
            class="input1"
            required
            [(ngModel)]="dataCorrida"
        >

        <label for="distanciaCorrida">Distância</label>

        <select
            name="distanciaCorrida"
            id="distanciaCorrida"
            [(ngModel)]="distanciaCorrida"
            required
        >
            <option value="">Selecione a distância</option>
            <option value="5 km">5 km</option>
            <option value="10 km">10 km</option>
            <option value="15 km">15 km</option>
            <option value="20 km">20 km</option>
            <option value="30 km">30 km</option>
            <option value="40 km">40 km</option>
            <option value="50 km">50 km</option>
        </select>

        <label for="localCorrida">Local</label>

        <input
            type="text"
            name="localCorrida"
            id="localCorrida"
            class="input1"
            maxlength="100"
            required
            placeholder="Digite o local da corrida"
            [(ngModel)]="localCorrida"
        >

        <div id="div-btns">

            <button type="submit" id="btnAdd">
                Cadastrar
            </button>

            <button type="reset" id="btnLimpar" (click)="limpar()">
                Limpar
            </button>

        </div>

    </form>

</section>
